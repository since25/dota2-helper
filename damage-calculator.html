<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 伤害组合计算器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="damage-calculator.css">
  <link rel="icon" type="image/png" href="images/dota2_favicon.png">
</head>
<body>
  <main class="damage-shell workbench-shell">
    <header class="damage-header workbench-header">
      <div>
        <h1>英雄伤害实验室</h1>
        <p>参考 Hero Calculator 的工作台结构，使用本项目本地语义模型计算。</p>
      </div>
      <nav class="damage-actions" aria-label="页面导航">
        <a href="/" class="damage-link">返回对局助手</a>
        <a href="/items.html" class="damage-link">物品模型</a>
      </nav>
    </header>

    <section class="workbench-layout">
      <aside class="workbench-panel control-panel">
        <h2>英雄</h2>
        <label>
          英雄
          <select id="heroSelect"></select>
        </label>
        <label>
          英雄等级
          <input id="heroLevelInput" type="number" min="1" max="30" value="6">
        </label>
        <div id="heroPanel" class="hero-panel-grid"></div>

        <h2>目标</h2>
        <label>
          敌方护甲
          <input id="enemyArmorInput" type="number" step="0.1" value="0">
        </label>
        <label>
          敌方魔抗 %
          <input id="enemyMagicResistanceInput" type="number" step="0.1" min="-100" max="100" value="25">
        </label>
        <label class="toggle-line">
          <input id="basicAttackEnabled" type="checkbox" checked>
          包含普攻
        </label>
        <label>
          普攻窗口
          <select id="attackWindowMode">
            <option value="attack_count">按攻击次数</option>
            <option value="duration">按持续时间</option>
          </select>
        </label>
        <label>
          窗口数值
          <input id="attackWindowValue" type="number" min="0" step="0.1" value="1">
        </label>
        <button id="calculateButton" type="button">重新计算</button>
        <p id="statusText" class="damage-status"></p>
      </aside>

      <section class="workbench-center">
        <section class="workbench-panel inventory-panel">
          <div class="section-heading">
            <h2>已选物品</h2>
            <button id="clearItemsButton" type="button" class="secondary-action">清空物品</button>
          </div>
          <div id="selectedItems" class="selected-items"></div>
        </section>

        <section class="workbench-panel">
          <div class="section-heading">
            <h2>技能组件</h2>
            <span id="abilityCount" class="muted-count"></span>
          </div>
          <div id="abilityRows" class="ability-workbench-grid"></div>
        </section>

        <section class="workbench-panel">
          <div class="section-heading">
            <h2>商店</h2>
            <input id="shopSearchInput" class="shop-search" type="search" placeholder="搜索物品或语义">
          </div>
          <div id="shopTabs" class="shop-tabs"></div>
          <div id="itemRows" class="shop-grid"></div>
        </section>
      </section>

      <aside class="damage-summary workbench-summary">
        <h2>计算结果</h2>
        <div class="summary-number">
          <span>原始总伤害</span>
          <strong id="rawTotal">0</strong>
        </div>
        <div class="summary-number">
          <span>抗性后总伤害</span>
          <strong id="adjustedTotal">0</strong>
        </div>
        <h3>目标有效抗性</h3>
        <div id="effectiveTarget" class="type-breakdown"></div>
        <h3>按类型</h3>
        <div id="typeBreakdown" class="type-breakdown"></div>
        <h3>战斗属性</h3>
        <div id="combatStatsBreakdown" class="type-breakdown"></div>
        <h3>伤害事件</h3>
        <div id="combatEventBreakdown" class="component-breakdown"></div>
        <h3>语义断言</h3>
        <div id="semanticAssertionBreakdown" class="component-breakdown"></div>
        <h3>明细</h3>
        <div id="componentBreakdown" class="component-breakdown"></div>
        <h3>提示</h3>
        <div id="warningList" class="warning-list"></div>
      </aside>
    </section>
  </main>

  <script src="damage-calculator.js"></script>
</body>
</html>
